name: build-packeton

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nxiglobal/packeton
    steps:
      # Upstream master, same source as packeton/packeton:latest
      - uses: actions/checkout@v4
        with:
          repository: vtsykun/packeton
          ref: master
      # NXI: dynamic pool instead of ondemand/16, FastCGI on loopback only
      - name: Tune php-fpm pool
        run: |
          sed -i \
            -e 's/^listen = .*/listen = 127.0.0.1:9000/' \
            -e 's/^pm = .*/pm = dynamic/' \
            -e 's/^pm.max_children = .*/pm.max_children = 24/' \
            -e 's/^pm.max_requests = .*/pm.max_requests = 1000/' \
            -e '/^pm.process_idle_timeout/d' \
            docker/php/www.conf
          cat >> docker/php/www.conf <<'EOF'
          pm.start_servers = 4
          pm.min_spare_servers = 2
          pm.max_spare_servers = 8
          EOF
          grep -E '^(listen|pm)' docker/php/www.conf
          # Fail if upstream changed the file and sed no longer matches
          grep -q '^listen = 127.0.0.1:9000' docker/php/www.conf
          grep -q '^pm.max_children = 24' docker/php/www.conf
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true   # always fetch the latest php:8.4-fpm-alpine
          push: true
          platforms: linux/amd64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:build-${{ github.run_number }}
      - name: Show PHP version of the pushed image
        run: docker run --rm --entrypoint php ${{ env.IMAGE }}:latest -v
      - name: Check php-fpm pool of the pushed image
        run: docker run --rm --entrypoint sh ${{ env.IMAGE }}:latest -c "grep -E '^(listen|pm)' /usr/local/etc/php-fpm.d/zzz-docker.conf && php-fpm -t"